<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#23272b">
<title>1, 2, 3 Soleil à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Baloo+2:wght@500;700&display=swap">
<style>
/* Réinitialisation de base */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* Cour de récré : bitume sombre, traits à la craie, un seul jaune soleil. Écran unique vertical. */
:root{
  --bitume:#23272b; --bitume-2:#2e3338; --craie:#eef0e8; --craie-dim:#9aa19a;
  --soleil:#ffd23f; --rouge:#ff3b30; --contour:#15171a; --sol-haut:#3b4046; --sol-bas:#545b62; --mur:#6a5a73; --mur-ombre:#4d4155; --pion:#ffd23f; --pion-ombre:#d9a514; --bonnet:#e5484d; --porcelaine:#ece4da; --cheveux:#1b1512;
  --f-display:"Gochi Hand","Comic Sans MS",cursive;
  --f-body:"Baloo 2",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
/* iPhone : 100 % inclut la zone sous la barre de Safari, ce qui coupe le bouton ; dvh suit l'écran réellement visible */
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bitume);color:var(--craie);font-family:var(--f-body);margin:0;
  display:flex;flex-direction:column;overflow:hidden;touch-action:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:10px 4px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0;color:var(--soleil);line-height:1}
.stats{font-size:.85rem;color:var(--craie-dim);text-align:right;font-variant-numeric:tabular-nums}
.stats b{color:var(--craie)}
#voix{background:none;border:1.5px dashed var(--craie-dim);color:var(--craie-dim);border-radius:8px;font:inherit;font-size:.8rem;padding:2px 8px;cursor:pointer}
#voix[aria-pressed="true"]{color:var(--craie);border-color:var(--craie)}

.terrain{flex:1;position:relative;min-height:0;margin-block:6px;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 100%,rgba(255,255,255,.06),transparent 70%),linear-gradient(180deg,var(--sol-haut),var(--sol-bas));
  border:3px solid var(--contour)}
.mur{position:absolute;top:0;left:0;right:0;height:116px;border-bottom:4px solid var(--contour);box-shadow:0 8px 0 rgba(0,0,0,.22);
  background:
    repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.22) 46px 49px),
    repeating-linear-gradient(0deg,transparent 0 21px,rgba(0,0,0,.28) 21px 24px),
    linear-gradient(180deg,var(--mur),var(--mur-ombre))}
.mur::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:rgba(255,255,255,.08)}

/* Poupée : deux faces (dos / visage) qui pivotent */
.compteur{position:absolute;top:6px;left:50%;width:100px;height:112px;margin-left:-50px;perspective:400px;z-index:2}
.pivot{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .12s cubic-bezier(.5,0,.2,1)}
.compteur.regarde .pivot{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.avant{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block}
.compteur.regarde .pupille{animation:lueur 1s ease-in-out infinite alternate}
@keyframes lueur{from{opacity:.55}to{opacity:1}}
.compteur.regarde{animation:tremble .12s linear 3}
@keyframes tremble{0%,100%{translate:0 0}50%{translate:2px 0}}

.arrivee{position:absolute;top:128px;left:10px;right:10px;height:8px;background:var(--soleil);border:3px solid var(--contour);border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.arrivee span{position:absolute;right:4px;top:12px;font:400 1.05rem var(--f-display);color:var(--soleil);letter-spacing:.05em;text-shadow:0 2px 0 var(--contour)}
.depart{position:absolute;bottom:18px;left:10px;right:10px;height:6px;background:var(--craie);border:3px solid var(--contour);border-radius:5px;opacity:.9}
.joueur{position:absolute;left:50%;bottom:14px;width:64px;height:82px;margin-left:-32px;z-index:1;
  transform-origin:50% 100%;will-change:transform;transform:translate3d(0,0,0)}
.joueur svg{width:100%;height:100%;display:block;overflow:visible}
.joueur .jg,.joueur .jd,.joueur .haut{transform-box:fill-box;transform-origin:50% 0}
.joueur.marche .jg{animation:pas .28s ease-in-out infinite alternate}
.joueur.marche .jd{animation:pas .28s ease-in-out infinite alternate-reverse}
.joueur.marche .haut{animation:rebond .14s ease-in-out infinite alternate}
@keyframes pas{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes rebond{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.joueur .perso{transform-box:view-box;transform-origin:32px 78px}
.joueur.tombe .perso{animation:chute .55s cubic-bezier(.5,0,.75,1.4) forwards}
@keyframes chute{0%{transform:rotate(0)}15%{transform:rotate(-12deg)}100%{transform:rotate(90deg)}}
.joueur .flaque{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0)}
.joueur.tombe .flaque{animation:flaque 1.6s .45s ease-out forwards}
@keyframes flaque{to{transform:scale(1)}}
.joueur .yeux-x{display:none}
.joueur.mort .yeux-x{display:inline}.joueur.mort .yeux{display:none}
.fusil{position:absolute;top:66px;left:calc(50% + 22px);width:84px;height:26px;z-index:2;pointer-events:none;
  transform-origin:12px 13px;opacity:0;transform:translateX(-20px) rotate(0deg)}
.fusil.sorti{opacity:1;transition:opacity .1s,transform .35s cubic-bezier(.3,1.4,.6,1)}
.fusil svg{width:100%;height:100%;display:block;overflow:visible}
.fusil .flash{opacity:0}
.fusil.tir .flash{animation:flash .18s linear}
@keyframes flash{0%,100%{opacity:0}20%,60%{opacity:1}}
.fusil.recul{animation:recul .2s ease-out}
.trait{position:absolute;height:3px;transform-origin:0 50%;z-index:2;pointer-events:none;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,240,180,0),#fff6c8 70%,var(--soleil));opacity:0}
.trait.vu{animation:trait .22s linear forwards}
@keyframes trait{0%{opacity:1}100%{opacity:0}}
#pseudo{font:600 1rem var(--f-body);background:transparent;color:var(--craie);border:2px dashed var(--craie-dim);border-radius:10px;padding:10px 14px;width:min(100%,240px);text-align:center;box-sizing:border-box}
#pseudo:focus{outline:none;border-color:var(--soleil)}
#pseudo{-webkit-user-select:text;user-select:text;touch-action:manipulation}
#pseudo::placeholder{color:var(--craie-dim)}
.annonce{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--f-display);font-size:clamp(3rem,16vw,5.5rem);
  line-height:1;color:var(--craie);pointer-events:none;contain:layout paint}
.annonce.chaud{color:var(--soleil)}
.annonce.alerte{color:var(--rouge)}

.voile{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(35,39,43,.93);text-align:center;padding:24px;z-index:3}
.voile h2{font-family:var(--f-display);font-weight:400;font-size:2.6rem;margin:0;color:var(--soleil);line-height:1}
.voile h2.perdu{color:var(--rouge)}
.voile p{margin:0;max-width:30ch;color:var(--craie);line-height:1.45}
.voile .petit{font-size:.85rem;color:var(--craie-dim)}
.btn{font:700 1.05rem var(--f-body);background:var(--soleil);color:var(--bitume);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
.btn:focus-visible,#avancer:focus-visible,#voix:focus-visible{outline:3px solid var(--craie);outline-offset:3px}

.commandes{padding-block:6px 14px;display:flex;flex-direction:column;align-items:center;gap:6px}
#avancer{width:min(100%,360px);height:84px;border-radius:999px;border:3px solid var(--craie);background:transparent;color:var(--craie);
  font:700 1.2rem var(--f-body);touch-action:none;cursor:pointer}
#avancer.appuye{background:var(--craie);color:var(--bitume)}
.aide{font-size:.8rem;color:var(--craie-dim)}
@media (prefers-reduced-motion:reduce){.fusil.sorti{transition:none}.joueur.marche .jg,.joueur.marche .jd,.joueur.marche .haut{animation:none}.pivot{transition:none}.compteur.regarde,.compteur.regarde .pupille{animation:none}}

/* À deux : deux couloirs, l'adversaire en bleu */
.joueur.moi{left:33%}
.joueur.autre{left:67%;--pion:#5ec8ff;--pion-ombre:#2b8bc0;--bonnet:#8b6cff}
.joueur.absent{display:none}
.lien{font:600 .85rem var(--f-body);color:var(--craie);background:var(--bitume-2);border:2px dashed var(--craie-dim);border-radius:10px;padding:8px 12px;max-width:100%;box-sizing:border-box;word-break:break-all;-webkit-user-select:text;user-select:text}
.rangee{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.second{background:transparent;color:var(--craie);border:2px solid var(--craie);padding:10px 22px}
.statut{font-size:.85rem;color:var(--craie-dim);margin:0}
.statut.ok{color:var(--soleil)}
.statut.ko{color:var(--rouge)}
.voile a{color:var(--craie-dim);font-size:.85rem}
.bandeau{position:absolute;left:10px;right:10px;bottom:34px;text-align:center;font:700 .95rem var(--f-body);color:var(--craie);
  background:rgba(21,23,26,.82);border-radius:10px;padding:6px 10px;z-index:2;pointer-events:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>
<header>
  <h1>1, 2, 3 Soleil</h1>
  <div class="stats">Adversaire : <b id="adv">—</b><br><button id="voix" aria-pressed="true">Son</button></div>
</header>

<main class="terrain" id="terrain">
  <div class="mur"></div>
  <div class="compteur" id="compteur" aria-label="Le compteur">
    <div class="pivot">
      <!-- Dos : cheveux en bataille -->
      <div class="face arriere">
        <svg viewBox="0 0 100 112">
          <path d="M18 90 L22 104 L30 94 L36 108 L44 96 L50 110 L56 96 L64 108 L70 94 L78 104 L82 90 Z" fill="var(--cheveux)" stroke="var(--contour)" stroke-width="3.5" stroke-linejoin="round"/>
          <ellipse cx="50" cy="52" rx="38" ry="44" fill="var(--cheveux)" stroke="var(--contour)" stroke-width="3.5"/>
          <path d="M30 24 Q40 42 34 70 M50 12 Q54 40 48 86 M70 24 Q62 44 68 76" stroke="#3d2f27" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="36" cy="26" rx="10" ry="6" fill="#fff" opacity=".12"/>
        </svg>
      </div>
      <!-- Visage : poupée de porcelaine fêlée -->
      <div class="face avant">
        <svg viewBox="0 0 100 112">
          <path d="M14 58 Q6 98 22 108 L32 90 Z M86 58 Q94 98 78 108 L68 90 Z" fill="var(--cheveux)" stroke="var(--contour)" stroke-width="3.5" stroke-linejoin="round"/>
          <ellipse cx="50" cy="56" rx="34" ry="40" fill="var(--porcelaine)" stroke="var(--contour)" stroke-width="3.5"/>
          <path d="M70 26 Q88 56 70 90 Q82 56 64 30 Z" fill="#000" opacity=".12"/>
          <ellipse cx="34" cy="42" rx="8" ry="5" fill="#fff" opacity=".7"/>
          <path d="M16 46 Q22 10 50 10 Q78 10 84 46 Q70 30 52 34 Q56 24 50 22 Q42 32 16 46 Z" fill="var(--cheveux)" stroke="var(--contour)" stroke-width="3.5" stroke-linejoin="round"/>
          <ellipse cx="37" cy="56" rx="9" ry="10" fill="#0b0909" stroke="var(--contour)" stroke-width="2"/>
          <ellipse cx="63" cy="56" rx="9" ry="10" fill="#0b0909" stroke="var(--contour)" stroke-width="2"/>
          <circle class="pupille" cx="38" cy="57" r="2.6" fill="var(--rouge)"/>
          <circle class="pupille" cx="62" cy="57" r="2.6" fill="var(--rouge)"/>
          <path d="M34 70 L32 82 M66 70 L68 80" stroke="#0b0909" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
          <circle cx="27" cy="72" r="5" fill="#d98a8a" opacity=".5"/>
          <circle cx="73" cy="72" r="5" fill="#d98a8a" opacity=".5"/>
          <path d="M37 83 Q50 92 63 83" stroke="var(--contour)" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M37 83 Q50 92 63 83" stroke="#9b1c1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M60 18 L56 30 L62 36 L55 48 M56 30 L49 33" stroke="#6d635a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M24 86 L30 92 L28 100" stroke="#6d635a" stroke-width="1.3" fill="none"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="arrivee"><span>ARRIVÉE</span></div>
  <div class="depart"></div>
  <div class="joueur moi" id="joueur">
    <svg viewBox="0 0 64 82" aria-hidden="true">
      <ellipse cx="32" cy="79" rx="22" ry="4.5" fill="#000" opacity=".35"/>
      <path class="flaque" d="M48 74 C40 72 42 64 54 66 C62 60 78 62 80 68 C90 68 92 76 82 80 C76 86 58 86 52 82 C44 82 42 76 48 74 Z" fill="#a3121c" stroke="#5c0a10" stroke-width="2"/>
      <g class="perso">
      <path class="jg" d="M17 60 h11 v14 a4 4 0 0 1 -4 4 h-7 a4 4 0 0 1 -4 -4 v-6 z" fill="var(--pion-ombre)" stroke="var(--contour)" stroke-width="3" stroke-linejoin="round"/>
      <path class="jd" d="M36 60 h11 l4 8 v6 a4 4 0 0 1 -4 4 h-7 a4 4 0 0 1 -4 -4 z" fill="var(--pion-ombre)" stroke="var(--contour)" stroke-width="3" stroke-linejoin="round"/>
      <g class="haut">
        <path d="M8 42 C8 22 18 12 32 12 C46 12 56 22 56 42 L56 54 C56 64 46 68 32 68 C18 68 8 64 8 54 Z" fill="var(--pion)" stroke="var(--contour)" stroke-width="3.5"/>
        <path d="M46 18 C56 26 58 44 54 58 C50 64 44 66 38 67 C48 58 50 36 46 18 Z" fill="var(--pion-ombre)"/>
        <ellipse cx="20" cy="27" rx="5" ry="7" fill="#fff" opacity=".55" transform="rotate(20 20 27)"/>
        <g class="yeux">
        <ellipse cx="25" cy="32" rx="4.2" ry="5" fill="#fff" stroke="var(--contour)" stroke-width="2"/>
        <ellipse cx="39" cy="32" rx="4.2" ry="5" fill="#fff" stroke="var(--contour)" stroke-width="2"/>
        <circle cx="26" cy="33" r="2" fill="var(--contour)"/><circle cx="40" cy="33" r="2" fill="var(--contour)"/>
        </g>
        <path class="yeux-x" d="M21 28 l8 8 M29 28 l-8 8 M35 28 l8 8 M43 28 l-8 8" stroke="var(--contour)" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M11 22 Q32 0 53 22 Q32 16 11 22 Z" fill="var(--bonnet)" stroke="var(--contour)" stroke-width="3" stroke-linejoin="round"/>
        <rect x="10" y="19" width="44" height="7" rx="3.5" fill="#f2f2f2" stroke="var(--contour)" stroke-width="3"/>
        <circle cx="32" cy="5" r="5" fill="#f2f2f2" stroke="var(--contour)" stroke-width="3"/>
        <rect x="14" y="42" width="36" height="17" rx="4" fill="#fff" stroke="var(--contour)" stroke-width="2.5"/>
        <text id="dossard" x="32" y="54" text-anchor="middle" font-family="Baloo 2, system-ui, sans-serif" font-weight="700" font-size="10" fill="var(--contour)">Joueur</text>
      </g>
      </g>
    </svg>
  </div>
  <div class="fusil" id="fusil">
    <svg viewBox="0 0 84 26" aria-hidden="true">
      <path d="M2 8 L24 8 L28 12 L28 20 L18 24 L4 22 Z" fill="#7a4a26" stroke="var(--contour)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M6 11 L22 11" stroke="#a46a3c" stroke-width="2" stroke-linecap="round"/>
      <rect x="24" y="7" width="22" height="9" rx="2" fill="#3a3d42" stroke="var(--contour)" stroke-width="2.5"/>
      <rect x="44" y="9" width="32" height="5" rx="1.5" fill="#55595f" stroke="var(--contour)" stroke-width="2.5"/>
      <path d="M32 16 L34 22 L39 22 L37 16" fill="#3a3d42" stroke="var(--contour)" stroke-width="2" stroke-linejoin="round"/>
      <g class="flash"><path d="M76 11.5 L90 4 L86 11.5 L96 12 L86 15 L90 21 Z" fill="var(--soleil)" stroke="#ff8a00" stroke-width="1.5" stroke-linejoin="round"/></g>
    </svg>
  </div>
  <div class="trait" id="trait"></div>
  <div class="annonce" id="annonce"></div>


  <div class="bandeau" id="bandeau" hidden></div>

  <div class="voile" id="voile">
    <h2 id="vTitre">À deux en ligne</h2>
    <p id="vTexte"></p>
    <input id="pseudo" maxlength="10" placeholder="Ton pseudo" autocomplete="off" aria-label="Ton pseudo">
    <div id="lienBloc" class="rangee" hidden>
      <div class="lien" id="lien"></div>
      <button class="btn second" id="copier">Copier le lien</button>
      <button class="btn second" id="partager" hidden>Partager</button>
    </div>
    <button class="btn" id="action">Créer une partie</button>
    <p class="statut" id="statut"></p>
    <a href="./" id="solo">Jouer seul</a>
  </div>
</main>

<div class="commandes">
  <button id="avancer" aria-label="Maintenir pour avancer">Maintenir pour avancer</button>
  <div class="aide">Sur ordinateur : barre d'espace</div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const terrain=$('terrain'), annonce=$('annonce'), compteur=$('compteur'), voile=$('voile'), btn=$('avancer'),
        vTitre=$('vTitre'), vTexte=$('vTexte'), statut=$('statut'), action=$('action'), bandeau=$('bandeau');

  const MOTS=['Un','Deux','Trois','Soleil !'];
  const VITESSE=8.5;      // % du parcours par seconde
  const REACTION=220;     // ms de tolérance après le retournement : il faut un très bon réflexe
  const POIDS=[0.24,0.26,0.24,0.26]; // chance de se retourner après un, deux, trois, soleil
  const SILENCE=8000;     // sans nouvelles de l'adversaire pendant ce temps, on le considère parti
  // Relais publics gratuits (MQTT sur WebSocket) : l'hôte prend le premier qui répond et l'inscrit dans le lien
  const RELAIS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];

  const params=new URLSearchParams(location.search);
  let salle=params.get('salle'), relais=Math.min(RELAIS.length-1,+params.get('b')||0);
  const role = salle ? 'invite' : 'hote';
  const monId=Math.random().toString(36).slice(2,10);
  let client=null, connecte=false;

  let partie='lobby', poupee='dos', appui=false, marche=false, debut=0, timers=[], dernier=0, voixOn=true;
  let motIdx=0, arretA=3, tempo=600, dernierArret=-1, course=0, dernierEnvoi=0, envoyeP=-1, envoyeM=false;
  const moi={nom:'Joueur', p:0, etat:'attente', s:0};
  let autre=null; // {id, nom, p, vueP, etat, s, marche, vu}

  // Le pion de l'adversaire est une copie du mien, recoloré par la classe .autre
  const elMoi=$('joueur'), elAutre=elMoi.cloneNode(true);
  elAutre.id='joueurAutre'; elAutre.className='joueur autre absent'; elMoi.after(elAutre);
  const dossardAutre=elAutre.querySelector('#dossard'); dossardAutre.removeAttribute('id'); dossardAutre.setAttribute('class','dossard');

  // Voix de la poupée : voix française féminine, un peu aiguë
  let voixFille=null;
  const FEMININES=/am[eé]lie|audrey|marie|c[eé]line|julie|virginie|aur[eé]lie|denise|hortense|eloise|éloïse|female|femme|google fran/i;
  function choisirVoix(){
    try{
      const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
      voixFille = vs.find(v=>FEMININES.test(v.name)) || vs.find(v=>!/thomas|daniel|henri|paul|male|homme/i.test(v.name)) || vs[0] || null;
    }catch(e){}
  }
  if(window.speechSynthesis){ choisirVoix(); try{ speechSynthesis.onvoiceschanged=choisirVoix; }catch(e){} }
  const DIRE={'Un':'Un.','Deux':'Deux.','Trois':'Trois.','Soleil !':'Soleil.'};

  let ac=null, bruitTir=null;
  function tir(){
    const c=audio(); if(!c||!voixOn) return;
    const t=c.currentTime;
    if(!bruitTir){ const n=c.sampleRate*0.5; bruitTir=c.createBuffer(1,n,c.sampleRate); const d=bruitTir.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); }
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=bruitTir; f.type='lowpass'; f.frequency.setValueAtTime(3500,t); f.frequency.exponentialRampToValueAtTime(400,t+0.3);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);

  /* ---------- Réseau ---------- */

  function recevoir(d){

      if(autre && autre.id!==d.de && partie==='encours'){ partie='lobby'; stop(); }

  function tirerSur(el){
    const fusil=$('fusil'), trait=$('trait'), T=terrain.getBoundingClientRect();

    $('partager').addEventListener('click',()=>{ navigator.share({title:'1, 2, 3 Soleil',text:'Viens jouer à 1, 2, 3 Soleil contre moi !',url:lienSalle()}).catch(()=>{}); });
  }

  try{ const p=localStorage.getItem('soleil-pseudo'); if(p){ $('pseudo').value=p; nommer(elMoi,p); moi.nom=p; } }catch(e){}
  if(role==='hote'){
    ecran({titre:'À deux en ligne', texte:'Crée une partie et envoie le lien à ton adversaire. Le premier qui franchit la ligne gagne.', pseudo:true, action:'Créer une partie', faire:creer, solo:true});
  } else {
    ecranInvite();
    connecter(relais,()=>{ if(!voile.hidden && action.textContent==='Rejoindre') statut.textContent=''; },
      ()=>ecran({titre:'Pas de connexion', texte:'Impossible de joindre le serveur de jeu. Vérifie ta connexion internet puis recharge la page.', perdu:true, solo:true}));
  }
  mesurer(); placer(elMoi,0); requestAnimationFrame(t=>{dernier=t; boucle(t);});
})();
</script>
